version: '3.8'

services:
  athleteiq-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athleteiq_core_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - athleteiq-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: athleteiq_db
    environment:
      POSTGRES_USER: athleteiq_user
      POSTGRES_PASSWORD: athleteiq_secure_password
      POSTGRES_DB: athleteiq_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - athleteiq-net

networks:
  athleteiq-net:
    driver: bridge

volumes:
  pgdata:
