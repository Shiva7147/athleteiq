[project]
name = "athleteiq"
version = "2.0.0"
description = "AthleteIQ 2.0: Elite Sports-Science Injury-Risk Decision-Support & Multi-Agent Tactical Platform"
readme = "README.md"
authors = [
    { name = "Shiva" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "scipy>=1.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "scikit-survival>=0.22.0",
    "mlflow>=2.11.0",
    "optuna>=3.6.0",
]
agent = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.35.0",
    "mcp>=1.0.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
